<!DOCTYPE html>
<html lang="en">
    {% include head.html %}
    <body>
        {% include header.html %}
        <main class="text-content">
            <h1>{{ page.title }}</h1>
            <img src="{{ page.coverimage }}" style="width: 100%;">
            <p>Published {{ page.date | date: '%b %-d, %Y' }} - By: 
                {% if page.authorsite %}
                <a href="{{page.authorsite}}">{{ page.author }}</a></p>
                {% else %}
                {{ page.author }}
                {% endif %}
                {{ content }}   
                
        </main>
        
        {% include footer.html %}
        <script src="/script.js"></script>
    </body>
</html>
